# buf.gen.yaml
# The version of the generation template.
# Required.
# The valid values are v1beta1, v1.
version: v1
# The plugins to run. "plugin" is required.
plugins:
  # The name of the plugin.
  # buf generate looks for a binary named protoc-gen-NAME on $PATH; `go`
  # resolves to protoc-gen-go, which the buf_go_proto_library rule provides
  # hermetically. We deliberately avoid a remote BSR plugin
  # (e.g. buf.build/protocolbuffers/go) because it is non-hermetic and gets
  # rate-limited on RBE.
  - plugin: go
    # The relative output directory.
    # Required.
    out: .
